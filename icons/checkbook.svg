<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f86d6"/><stop offset="1" stop-color="#1b4f93"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/><stop offset="1" stop-color="#cfe2f7"/>
    </linearGradient>
    <radialGradient id="coin" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#b9f39a"/><stop offset=".55" stop-color="#4aa82b"/><stop offset="1" stop-color="#23661a"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- checkbook cover -->
  <rect x="4" y="14" width="50" height="36" rx="4" fill="url(#cover)" stroke="#123a6e" stroke-width="1.2"/>
  <!-- check slip -->
  <rect x="8" y="10" width="46" height="30" rx="2" fill="url(#paper)" stroke="#5b85b8" stroke-width="1"/>
  <rect x="8" y="10" width="46" height="5" rx="2" fill="#9cc2ea"/>
  <line x1="12" y1="22" x2="40" y2="22" stroke="#7d9cc2" stroke-width="1.4"/>
  <line x1="12" y1="28" x2="46" y2="28" stroke="#7d9cc2" stroke-width="1.4"/>
  <rect x="40" y="18" width="10" height="6" rx="1" fill="#fff" stroke="#7d9cc2"/>
  <path d="M30 35 q3 -4 6 0 t6 0" fill="none" stroke="#1b4f93" stroke-width="1.4" stroke-linecap="round"/>
  <!-- gloss on cover -->
  <rect x="5" y="15" width="48" height="12" rx="3" fill="url(#gloss)" opacity=".5"/>
  <!-- coin -->
  <circle cx="46" cy="47" r="13" fill="url(#coin)" stroke="#1d5214" stroke-width="1.2"/>
  <circle cx="46" cy="47" r="10" fill="none" stroke="#d9ffc6" stroke-opacity=".6" stroke-width="1"/>
  <text x="46" y="53.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="#fff" stroke="#1d5214" stroke-width=".6">$</text>
  <ellipse cx="42" cy="40" rx="6" ry="3" fill="#fff" opacity=".35"/>
</svg>
